[project]
name = "emguidance-formulary-api"
version = "0.1.0"
description = "FastAPI formulary and dispensing API for the EMGuidance full-stack assessment."
requires-python = ">=3.12"
dependencies = [
  "alembic==1.13.3",
  "fastapi==0.115.0",
  "psycopg[binary]==3.2.2",
  "pydantic-settings==2.5.2",
  "python-dateutil==2.9.0.post0",
  "sqlalchemy==2.0.35",
  "uvicorn[standard]==0.30.6"
]

[project.optional-dependencies]
dev = [
  "httpx==0.27.2",
  "pytest==8.3.3",
  "pytest-cov==5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:cacheprovider"]
markers = [
  "no_db: test does not need the PostgreSQL cleanup fixture"
]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
ignore = [
  "B008"
]

